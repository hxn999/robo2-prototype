<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - Corporate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            50: '#f8fafc',
                            accent: '#CA8A04',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen pb-32">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-20 shadow-sm border-b border-gray-100">
        <div class="px-4 py-4 flex items-center justify-between">
            <div class="flex items-center">
                <a href="application_list.html" class="p-2 -ml-2 text-gray-500 hover:text-gray-900 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>
                <h1 id="page-title" class="ml-2 text-lg font-bold text-gray-900 truncate max-w-[200px]">New Application
                </h1>
            </div>
            <div class="flex items-center">
                <span class="text-[10px] font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-full"
                    id="app-id">APP-2026-XXXX</span>
            </div>
        </div>
    </header>

    <main class="p-6 space-y-6">

        <!-- User & Application Info -->
        <section class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label
                        class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Initiator</label>
                    <p class="text-sm font-semibold text-gray-900">Mr. Anderson</p>
                </div>
                <div>
                    <label
                        class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Department</label>
                    <p class="text-sm font-semibold text-gray-900">IT Operations</p>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Date</label>
                    <p class="text-sm font-semibold text-gray-900" id="current-date">Feb 03, 2026</p>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Type</label>
                    <p class="text-sm font-semibold text-brand-accent uppercase" id="app-type-display">General</p>
                </div>
            </div>
        </section>

        <!-- Form Fields -->
        <form class="space-y-4">
            <div>
                <label
                    class="block text-xs font-bold text-gray-500 uppercase tracking-tighter mb-1 ml-1">Subject</label>
                <input type="text" placeholder="Brief summary of request"
                    class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand-900 focus:border-transparent outline-none transition-all shadow-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label
                        class="block text-xs font-bold text-gray-500 uppercase tracking-tighter mb-1 ml-1">Priority</label>
                    <select
                        class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-brand-900 outline-none shadow-sm">
                        <option>Normal</option>
                        <option>Urgent</option>
                        <option>Low</option>
                    </select>
                </div>
                <div>
                    <label
                        class="block text-xs font-bold text-gray-500 uppercase tracking-tighter mb-1 ml-1">Category</label>
                    <select
                        class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-brand-900 outline-none shadow-sm">
                        <option>Option 1</option>
                        <option>Option 2</option>
                    </select>
                </div>
            </div>

            <div>
                <label
                    class="block text-xs font-bold text-gray-500 uppercase tracking-tighter mb-1 ml-1">Details</label>
                <textarea rows="4" placeholder="Describe your request in detail..."
                    class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand-900 focus:border-transparent outline-none transition-all shadow-sm"></textarea>
            </div>

            <!-- Document Attachments -->
            <div class="pt-2">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-tighter mb-3 ml-1">Document
                    Attachments</label>

                <div class="space-y-3">
                    <!-- Attachment Field 1 -->
                    <div
                        class="flex items-center justify-between p-3 bg-gray-50 border border-dashed border-gray-300 rounded-xl">
                        <div class="flex items-center space-x-3">
                            <div class="p-2 bg-white rounded-lg shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                                </svg>
                            </div>
                            <span class="text-xs font-semibold text-gray-600">Application File</span>
                        </div>
                        <button type="button"
                            class="text-xs font-bold text-brand-900 bg-white px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm active:scale-95 transition-all">Upload</button>
                    </div>

                    <!-- Attachment Field 2 -->
                    <div
                        class="flex items-center justify-between p-3 bg-gray-50 border border-dashed border-gray-300 rounded-xl">
                        <div class="flex items-center space-x-3">
                            <div class="p-2 bg-white rounded-lg shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                                </svg>
                            </div>
                            <span class="text-xs font-semibold text-gray-600">Supporting Docs</span>
                        </div>
                        <button type="button"
                            class="text-xs font-bold text-brand-900 bg-white px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm active:scale-95 transition-all">Upload</button>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <!-- Footer Controls -->
    <div
        class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-100 p-6 flex space-x-4 z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
        <button
            class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl text-sm font-bold hover:bg-gray-200 transition-all active:scale-95">
            Save Draft
        </button>
        <button onclick="handleSubmit()"
            class="flex-2 w-2/3 py-4 bg-brand-900 text-white rounded-2xl text-sm font-bold hover:bg-brand-800 transition-all active:scale-95 shadow-lg shadow-brand-900/20">
            Submit Application
        </button>
    </div>

    <script>
        // Parse URL params for dynamic type
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'New Application';

        document.getElementById('page-title').innerText = type;
        document.getElementById('app-type-display').innerText = type;

        // Generate Dummy App ID
        const randomNum = Math.floor(Math.random() * 9000) + 1000;
        document.getElementById('app-id').innerText = `APP-2026-${randomNum}`;

        // Set Today's Date
        const options = { month: 'short', day: '2-digit', year: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', options);

        function handleSubmit() {
            alert('Application submitted successfully!\nTracking ID: ' + document.getElementById('app-id').innerText);
            window.location.href = 'home.html';
        }
    </script>
</body>

</html>
