<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Corporate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Simple slide-up animation */
        .slide-up-enter {
            transform: translateY(100%);
        }

        .slide-up-enter-active {
            transform: translateY(0);
            transition: transform 0.3s ease-out;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#0f172a', // Slate 900
                            800: '#1e293b',
                            700: '#334155',
                            accent: '#CA8A04', // Muted Gold
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen text-brand-900 overflow-hidden relative">

    <div class="w-full max-w-sm px-6 transition-all duration-300" id="main-content">
        <!-- Logo / Branding Area -->
        <div class="mb-10 text-center flex justify-center flex-col items-center gap-6">
            <img src="image.png" alt="Company Logo" class="h-16 w-auto object-contain fallback-hidden"
                onerror="this.style.display='none'">
            <!-- Fallback Icon if image missing -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-brand-900 text-white shadow-lg"
                id="fallback-icon" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
            </div>
            <script>
                // Show fallback if image fails (handled by onerror above mostly)
                document.querySelector('img').onerror = function () {
                    this.style.display = 'none';
                    document.getElementById('fallback-icon').style.display = 'flex';
                }
                // Check if src is placeholder text
                if (document.querySelector('img').getAttribute('src') === 'image.png') {
                    // We assume image.png might not exist in the user's new env, so we might inevitably show fallback.
                }
            </script>

            <p class="text-sm text-gray-500 mt-2">Sign in to your account</p>
        </div>


        <!-- Login Form -->
        <form id="loginForm" action="home.html" class="space-y-6">

            <!-- Server / Domain -->
            <div>
                <label for="server"
                    class="block text-xs font-medium text-gray-500 uppercase tracking-widest mb-2">Server Domain</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                        </svg>
                    </span>
                    <input type="text" id="server"
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:border-brand-900 focus:ring-1 focus:ring-brand-900 transition-colors bg-white shadow-sm"
                        placeholder="company-server.com" value="secure.corp.net">
                </div>
            </div>

            <!-- Username -->
            <div>
                <label for="username"
                    class="block text-xs font-medium text-gray-500 uppercase tracking-widest mb-2">Username Or
                    Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </span>
                    <input type="text" id="username"
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:border-brand-900 focus:ring-1 focus:ring-brand-900 transition-colors bg-white shadow-sm"
                        placeholder="Username Or Email">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password"
                    class="block text-xs font-medium text-gray-500 uppercase tracking-widest mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </span>
                    <input type="password" id="password"
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg text-sm placeholder-gray-400 focus:outline-none focus:border-brand-900 focus:ring-1 focus:ring-brand-900 transition-colors bg-white shadow-sm"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                        class="h-5 w-5 text-brand-900 accent-brand-900 focus:ring-brand-900 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-600">
                        Remember me
                    </label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-brand-900 hover:text-brand-800">
                        Need help?
                    </a>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-brand-900 hover:bg-brand-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-900 transition-all transform active:scale-[0.98]">
                Secure Login
            </button>
        </form>

        <p class="mt-8 text-center text-xs text-gray-400">
            v2.4.0 &middot; Robo2 Workflow Automation & DMS System
        </p>
    </div>

    <!-- Sliding Dialog Overlay -->
    <div id="dialog-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0"></div>

    <!-- Sliding Dialog -->
    <div id="save-info-dialog"
        class="fixed bottom-0 left-0 right-0 bg-white rounded-t-2xl z-50 transform translate-y-full transition-transform duration-300 ease-in-out p-6 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.3)]">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>

        <div class="text-center mb-6">
            <h3 class="text-lg font-bold text-gray-900 mb-2">Save Login Information?</h3>
            <p class="text-sm text-gray-500">Would you like to securely save this Site URL and Username for faster login
                next time?</p>
        </div>

        <div class="space-y-3">
            <button id="btn-save"
                class="w-full py-3.5 px-4 bg-brand-900 text-white rounded-xl text-sm font-semibold shadow-sm active:scale-[0.98] transition-transform">
                Save Information
            </button>
            <button id="btn-skip"
                class="w-full py-3.5 px-4 bg-gray-100 text-gray-700 rounded-xl text-sm font-semibold hover:bg-gray-200 active:scale-[0.98] transition-all">
                Skip for now
            </button>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const dialog = document.getElementById('save-info-dialog');
        const overlay = document.getElementById('dialog-overlay');
        const mainContent = document.getElementById('main-content');
        const btnSave = document.getElementById('btn-save');
        const btnSkip = document.getElementById('btn-skip');

        function showDialog() {
            overlay.classList.remove('hidden');
            // Small delay to allow display:block to apply before opacity transition
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                dialog.classList.remove('translate-y-full');
                mainContent.classList.add('scale-95', 'opacity-90');
            }, 10);
        }

        function proceedToHome() {
            window.location.href = 'home.html';
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            // In a real app, validation would happen here
            showDialog();
        });

        btnSave.addEventListener('click', function () {
            // Logic to save info (e.g. localStorage)
            localStorage.setItem('saved_domain', document.getElementById('server').value);
            localStorage.setItem('saved_username', document.getElementById('username').value);
            proceedToHome();
        });

        btnSkip.addEventListener('click', function () {
            proceedToHome();
        });

        // Close on overlay click (optional, maybe treat as skip?)
        overlay.addEventListener('click', function () {
            proceedToHome();
        });

    </script>
</body>

</html>
