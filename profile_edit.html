<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Corporate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
     <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#0f172a', // Slate 900
                            800: '#1e293b',
                            700: '#334155',
                            accent: '#CA8A04', // Muted Gold
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-20 w-full">
        <div class="px-6 py-4 flex items-center">
            <a href="home.html" class="p-2 -ml-2 text-gray-500 hover:text-gray-900 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <h1 class="ml-4 text-lg font-bold text-gray-900">Edit Profile</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-8">
        <form class="space-y-8">
            <!-- Profile Photo Section -->
            <div class="flex flex-col items-center">
                <div class="relative group cursor-pointer" onclick="document.getElementById('photo-upload').click()">
                    <div
                        class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-lg relative bg-gray-200">
                        <img id="profile-preview"
                            src="https://ui-avatars.com/api/?name=Mr.+Anderson&background=random&size=128" alt="Profile"
                            class="w-full h-full object-cover">
                        <div
                            class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                    </div>
                    <button type="button"
                        class="absolute bottom-0 right-0 bg-brand-900 text-white p-2 rounded-full shadow-lg border-2 border-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                    <input type="file" id="photo-upload" class="hidden" accept="image/*" onchange="previewImage(event)">
                </div>
                <p class="mt-4 text-sm text-gray-500 font-medium">Click to change photo</p>
            </div>

            <!-- Basic Info Fields -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Full
                        Name</label>
                    <input type="text" value="Mr. Anderson"
                        class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-900 focus:ring-1 focus:ring-brand-900 transition-all shadow-sm">
                </div>

                <div>
                    <label
                        class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Professional
                        Title</label>
                    <input type="text" value="Administrator"
                        class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-900 focus:ring-1 focus:ring-brand-900 transition-all shadow-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">Email
                        Address</label>
                    <input type="email" value="anderson@corp-portal.com"
                        class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-900 focus:ring-1 focus:ring-brand-900 transition-all shadow-sm">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-6 space-y-3">
                <button type="submit"
                    class="w-full py-4 bg-brand-900 text-white rounded-xl text-sm font-bold shadow-lg shadow-gray-200 hover:bg-brand-800 active:scale-[0.98] transition-all">
                    Save Changes
                </button>
                <a href="home.html"
                    class="block w-full py-4 text-center text-sm font-bold text-gray-500 hover:text-gray-900 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </main>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function () {
                const output = document.getElementById('profile-preview');
                output.src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>

</html>
