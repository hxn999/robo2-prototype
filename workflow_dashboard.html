<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Dashboard - Corporate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            50: '#f8fafc',
                            accent: '#CA8A04',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-brand-900 sticky top-0 z-20 shadow-lg">
        <div class="px-4 py-4 flex items-center space-x-4">
            <a href="home.html" class="p-2 -ml-2 text-gray-300 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-lg font-semibold text-white">Workflow Dashboard</h1>
        </div>
    </header>

    <main class="px-4 py-6 space-y-6">

        <!-- Critical Attention Section -->
        <section class="grid grid-cols-2 gap-4">
            <!-- Pending Card -->
            <a href="workflow_list.html?filter=pending"
                class="bg-white rounded-xl p-4 shadow-sm border border-l-4 border-gray-100 border-l-brand-accent hover:shadow-md transition-shadow active:scale-[0.98]">
                <div class="flex justify-between items-start mb-2">
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Pending</p>
                    <span class="h-2 w-2 rounded-full bg-brand-accent"></span>
                </div>
                <div class="text-3xl font-bold text-gray-900">12</div>
                <p class="text-[10px] text-gray-400 mt-1">Require your action</p>
            </a>

            <!-- Overdue Card -->
            <a href="workflow_list.html?filter=overdue"
                class="bg-white rounded-xl p-4 shadow-sm border border-l-4 border-gray-100 border-l-red-500 hover:shadow-md transition-shadow active:scale-[0.98]">
                <div class="flex justify-between items-start mb-2">
                    <p class="text-xs font-bold text-red-500 uppercase tracking-wider">Overdue</p>
                    <span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
                </div>
                <div class="text-3xl font-bold text-gray-900">3</div>
                <p class="text-[10px] text-gray-400 mt-1">Attention needed</p>
            </a>
        </section>

        <!-- Secondary Information -->
        <section class="space-y-3">
            <h2 class="text-sm font-semibold text-gray-900 uppercase tracking-wide">Overview</h2>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 divide-y divide-gray-100">
                <!-- Unclaimed -->
                <a href="workflow_list.html?filter=unclaimed"
                    class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors">
                    <div class="flex items-center space-x-3">
                        <div class="bg-purple-100 p-2 rounded-lg text-purple-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                        </div>
                        <span class="text-sm font-medium text-gray-700">Unclaimed Tasks</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-lg font-bold text-gray-900">5</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </a>

                <!-- My Participated -->
                <a href="workflow_list.html?filter=participated"
                    class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors">
                    <div class="flex items-center space-x-3">
                        <div class="bg-green-100 p-2 rounded-lg text-green-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <span class="text-sm font-medium text-gray-700">My Participated</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-lg font-bold text-gray-900">128</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </a>

                <!-- Queries -->
                <a href="workflow_list.html?filter=queries"
                    class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors">
                    <div class="flex items-center space-x-3">
                        <div class="bg-orange-100 p-2 rounded-lg text-orange-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <span class="text-sm font-medium text-gray-700">Queries</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-lg font-bold text-gray-900">2</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </a>
            </div>
        </section>

        <!-- Recent Activity / Shortcut -->
        <section>
            <h2 class="text-sm font-semibold text-gray-900 uppercase tracking-wide mb-3">Quick Actions</h2>
            <div class="grid grid-cols-2 gap-4">
                <a href="#"
                    class="bg-brand-accent rounded-xl p-4 text-white shadow-lg active:scale-[0.98] transition-all">
                    <div class="mb-3 bg-white/20 w-fit p-2 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </div>
                    <p class="text-sm font-bold">New Application</p>
                    <p class="text-[10px] text-white/80 mt-1">Start a new request</p>
                </a>

                <div class="bg-brand-900 rounded-xl p-4 text-white shadow-lg flex flex-col justify-between">
                    <a href="delegate.html">

                        <div class="flex justify-between items-start mb-2">
                            <div class="bg-white/10 p-2 rounded-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                                </svg>
                            </div>
                        </div>
                        <div>
                            <p class="text-sm font-medium">Delegate</p>
                            <p class="text-[10px] text-gray-400">Manage Access</p>
                        </div>
                    </a>
                </div>
            </div>
        </section>

    </main>

    <!-- Floating Action / Simple Footer Navigation if needed (omitted for cleaner specific flow) -->

</body>

</html>
