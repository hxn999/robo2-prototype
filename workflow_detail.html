<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details - Corporate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            50: '#f8fafc',
                            accent: '#CA8A04',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-20 shadow-sm border-b border-gray-100 flex-none">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center">
                <a href="workflow_list.html" class="p-2 -ml-2 text-gray-500 hover:text-gray-900 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>
                <div class="ml-2">
                    <p class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Expense Claim</p>
                    <h1 class="text-sm font-bold text-gray-900">Monthly Travel - Jan</h1>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-gray-400">Total Amount</p>
                <p class="text-sm font-bold text-gray-900">$1,250.00</p>
            </div>
        </div>
    </header>

    <!-- Web View Container (Simulated) -->
    <main class="flex-grow p-4 overflow-y-auto pb-32">
        <div
            class="bg-white rounded-lg shadow-sm min-h-[500px] border border-gray-200 p-8 flex flex-col items-center justify-center text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p class="text-sm font-medium">Application Form View</p>
            <p class="text-xs mt-2 text-center max-w-xs">This area loads the existing web form for the specific
                application type.</p>

            <!-- Dummy Form Content to simulate scrolling -->
            <div class="mt-8 w-full space-y-4 max-w-md opacity-25">
                <div class="h-4 bg-gray-200 rounded w-1/3"></div>
                <div class="h-10 bg-gray-200 rounded w-full"></div>
                <div class="h-4 bg-gray-200 rounded w-1/4"></div>
                <div class="h-24 bg-gray-200 rounded w-full"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                <div class="h-10 bg-gray-200 rounded w-full"></div>
            </div>
        </div>
    </main>

    <!-- Sticky Action Bar -->
    <footer
        class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] p-4 z-30">
        <div class="grid grid-cols-4 gap-2">

            <!-- Send Back / Query -->
            <button
                class="col-span-1 flex flex-col items-center justify-center py-2 rounded-lg text-gray-500 hover:bg-gray-50 active:scale-95 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-[10px] font-medium">Query</span>
            </button>

            <!-- Reject -->
            <button
                class="col-span-1 flex flex-col items-center justify-center py-2 rounded-lg text-red-600 hover:bg-red-50 active:scale-95 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-[10px] font-medium">Reject</span>
            </button>

            <!-- Approve (Primary Action) -->
            <button
                class="col-span-2 bg-brand-900 text-white rounded-lg flex items-center justify-center space-x-2 shadow-lg hover:bg-brand-800 active:scale-[0.98] transition-all">
                <span class="text-sm font-bold">Approve Request</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </button>

        </div>
    </footer>

</body>

</html>
